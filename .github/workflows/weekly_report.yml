name: Weekly Match Report

on:
  # 定时发送已停用（二工大和复旦已被淘汰）
  # schedule:
  #   - cron: '0 10 * * 0'
  workflow_dispatch:

jobs:
  generate_report:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - school_alias: "二工大"
            school_name: "上海第二工业大学"
            recipient_secret: "MAIL_RECIPIENT"
          - school_alias: "复旦"
            school_name: "复旦大学"
            recipient_secret: "FUDAN_RECIPIENT"
    
    steps:
      - name: Call Wasmer Agent to generate report
        id: fetch
        run: |
          RESPONSE=$(curl -s -w "%{http_code}" -X POST https://code-agent.wasmer.app/webhook \
            -H "Content-Type: application/json" \
            -d '{"post_type":"message","message":"生成${{ matrix.school_alias }}战报"}')
          
          HTTP_CODE="${RESPONSE: -3}"
          BODY="${RESPONSE%???}"
          
          echo "HTTP Status: $HTTP_CODE"
          
          if echo "$BODY" | jq -e . >/dev/null 2>&1; then
            REPORT_CONTENT=$(echo "$BODY" | jq -r '.[0].data.text | join("\n\n")')
          else
            REPORT_CONTENT="$BODY"
          fi
          
          # 提取周数或轮数
          WEEK_NUM=$(echo "$REPORT_CONTENT" | grep -oP '第\d+周' | head -1 | grep -oP '\d+' || echo "")
          ROUND_NUM=$(echo "$REPORT_CONTENT" | grep -oP '第\d+轮' | head -1 | grep -oP '\d+' || echo "")
          
          if [ -n "$WEEK_NUM" ]; then
            NUM="$WEEK_NUM"
            TYPE="周"
          elif [ -n "$ROUND_NUM" ]; then
            NUM="$ROUND_NUM"
            TYPE="轮"
          else
            NUM="最新"
            TYPE=""
          fi
          
          echo "$REPORT_CONTENT" > report.txt
          echo "NUM=$NUM" >> $GITHUB_ENV
          echo "TYPE=$TYPE" >> $GITHUB_ENV
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Error: HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Send email via Python
        env:
          BOT_MAIL_USERNAME: ${{ secrets.BOT_MAIL_USERNAME }}
          BOT_MAIL_PASSWORD: ${{ secrets.BOT_MAIL_PASSWORD }}
          MAIL_RECIPIENT: ${{ secrets[matrix.recipient_secret] }}
          SCHOOL_NAME: ${{ matrix.school_name }}
          SCHOOL_ALIAS: ${{ matrix.school_alias }}
          NUM: ${{ env.NUM }}
          TYPE: ${{ env.TYPE }}
        run: |
          python3 << 'EOF'
          import smtplib
          import ssl
          from email.mime.text import MIMEText
          from email.header import Header
          import os
          from datetime import datetime, timedelta
          
          with open('report.txt', 'r', encoding='utf-8') as f:
              report_content = f.read()
          
          sender = os.environ['BOT_MAIL_USERNAME']
          password = os.environ['BOT_MAIL_PASSWORD']
          receiver = os.environ['MAIL_RECIPIENT']
          school_name = os.environ.get('SCHOOL_NAME', '上海第二工业大学')
          school_alias = os.environ.get('SCHOOL_ALIAS', '二工大')
          num = os.environ.get('NUM', '最新')
          type_suffix = os.environ.get('TYPE', '')
          
          beijing_time = datetime.utcnow() + timedelta(hours=8)
          date_str = beijing_time.strftime('%Y年%m月%d日 %H:%M:%S')
          
          # 生成标题：如果有类型则显示，否则显示"最新"
          if num != '最新' and type_suffix:
              title_suffix = f"第{num}{type_suffix}战报"
          else:
              title_suffix = "最新战报"
          
          subject = f"📊 {school_name} - {title_suffix} {beijing_time.strftime('%Y年%m月%d日')}"
          body_title = f"📊 {school_name} - {title_suffix}"
          
          body = f"""
          {body_title}
          
          生成时间：{date_str}（北京时间）
          
          ----------------------------------------
          
          {report_content}
          
          ----------------------------------------
          
          📎 在线查看：https://arena.pesiu.org/
          🤖 机器人：qq群发送"@aaa疯狂窝瓜 生成战报"，获取最新战报
          """
          
          msg = MIMEText(body, 'plain', 'utf-8')
          msg['Subject'] = Header(subject, 'utf-8')
          msg['From'] = sender
          msg['To'] = receiver
          
          try:
              context = ssl.create_default_context()
              with smtplib.SMTP_SSL("smtp.qq.com", 465, context=context) as server:
                  server.login(sender, password)
                  server.sendmail(sender, [receiver], msg.as_string())
              print(f"✅ 邮件发送成功！{school_name} -> {receiver}")
          except Exception as e:
              print(f"❌ 邮件发送失败：{school_name} -> {receiver}，错误：{e}")
              exit(1)
          EOF